<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E6F3FA">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="動詞モンスター">
<title>不規則動詞モンスター</title>

<style>
:root{
  --sky:#E6F3FA; --grass:#CFEBC4; --grass-deep:#A9D697;
  --ink:#4A3A34; --ink-soft:#7B6A62; --card:#FFFFFF; --line:#E3DCD6;
  --pink:#F07A98; --pink-soft:#FDE3EA; --ok:#4E9F5B; --ok-soft:#E3F4E4;
  --ng:#D0564F; --ng-soft:#FBE4E2; --cue:#FFE08A; --btn:#FFF7E8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky:#1E2B3A; --grass:#2E4A33; --grass-deep:#3D6242;
    --ink:#F2EAE4; --ink-soft:#C3B6AE; --card:#2A2F38; --line:#454B55;
    --pink:#F58FA9; --pink-soft:#4A2E37; --ok:#7CCB88; --ok-soft:#24392A;
    --ng:#F08A83; --ng-soft:#46292A; --cue:#7A6320; --btn:#353A44;
  }
}
:root[data-theme="dark"]{
  --sky:#1E2B3A; --grass:#2E4A33; --grass-deep:#3D6242;
  --ink:#F2EAE4; --ink-soft:#C3B6AE; --card:#2A2F38; --line:#454B55;
  --pink:#F58FA9; --pink-soft:#4A2E37; --ok:#7CCB88; --ok-soft:#24392A;
  --ng:#F08A83; --ng-soft:#46292A; --cue:#7A6320; --btn:#353A44;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--sky);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Arial Rounded MT Bold",sans-serif;font-size:17px;line-height:1.6;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding:12px 16px 24px;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.link{background:none;border:none;padding:8px 4px;color:var(--ink-soft);font-weight:700}
.chip{font-size:14px;color:var(--ink-soft);font-weight:700}
h1{font-size:28px;font-weight:800;line-height:1.25;margin:20px 0 4px;letter-spacing:.02em}
.sub{color:var(--ink-soft);margin:0 0 16px}
.field{position:relative;background:var(--grass);border-radius:28px 28px 12px 12px;padding:16px 8px 10px;text-align:center;overflow:hidden}
.field::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-30px;height:60px;background:var(--grass-deep);border-radius:50%;opacity:.5}
.field svg{position:relative;z-index:1}
.parade{display:flex;justify-content:center;gap:2px}
.parade svg{width:25%;max-width:96px;height:auto}
.btn{display:block;width:100%;min-height:52px;border:2px solid var(--ink);border-radius:16px;background:var(--pink);color:#fff;font-weight:800;font-size:18px;padding:10px 16px;margin-top:12px;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.sec{background:var(--btn);color:var(--ink)}
.stats{display:flex;gap:10px;margin-top:16px}
.stat{flex:1;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:800}
.stat span{font-size:13px;color:var(--ink-soft)}
.mon{width:180px;height:auto;max-width:60%}
.mon.evolve{animation:evolve .7s ease-out}
.mon.flee{animation:flee .8s ease-in forwards}
.mon.appear{animation:appear .5s ease-out}
@keyframes evolve{0%{transform:scale(.7);filter:brightness(1.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes flee{0%{transform:translateX(0)}20%{transform:translateX(-8px) translateY(-6px)}100%{transform:translateX(140%);opacity:0}}
@keyframes appear{0%{transform:translateY(24px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.mon.evolve,.mon.flee,.mon.appear{animation:none}}
.word{position:relative;z-index:1;font-size:26px;font-weight:800;margin-top:2px;letter-spacing:.03em}
.forms{position:relative;z-index:1;font-size:14px;color:var(--ink-soft);min-height:22px}
.hearts{position:relative;z-index:1;display:flex;justify-content:center;gap:4px;margin-top:4px}
.hearts i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.55);border:1.5px solid var(--ink-soft)}
.hearts i.on{background:var(--pink);border-color:var(--pink)}
.tag{display:inline-block;font-size:13px;font-weight:700;background:var(--card);border-radius:999px;padding:2px 10px;margin-bottom:4px;position:relative;z-index:1}
.q{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:14px}
.q h2{font-size:17px;font-weight:700;margin:0 0 8px;color:var(--ink-soft)}
.sent{font-size:19px;line-height:1.7;margin:0}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--pink);text-align:center;font-weight:800;color:var(--pink)}
.ans{font-weight:800;color:var(--ok);border-bottom:3px solid var(--ok);padding:0 2px}
mark.cue{background:var(--cue);color:inherit;border-radius:4px;padding:0 2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{min-height:56px;border:2px solid var(--line);border-radius:14px;background:var(--btn);font-size:19px;font-weight:700;padding:8px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.slots{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;margin-top:12px;padding:6px;border:2px dashed var(--line);border-radius:14px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center}
.tile{width:46px;height:50px;border:2px solid var(--ink);border-radius:12px;background:var(--card);font-size:22px;font-weight:800;box-shadow:0 3px 0 var(--ink)}
.tile[disabled]{opacity:.2;box-shadow:none}
.slot{width:40px;height:40px;border:none;border-radius:10px;background:var(--pink-soft);font-size:20px;font-weight:800}
.row{display:flex;gap:10px}
.row .btn{margin-top:10px}
input.type{width:100%;min-height:54px;margin-top:12px;border:2px solid var(--ink);border-radius:14px;padding:8px 14px;font:inherit;font-size:22px;font-weight:700;background:var(--card);color:var(--ink)}
.err{color:var(--ng);font-size:14px;min-height:20px;margin-top:4px}
.hint{background:var(--pink-soft);border-radius:12px;padding:8px 12px;margin-top:10px;font-size:15px}
.fb{border-radius:16px;padding:12px 16px;margin-top:12px;border:2px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.ng{background:var(--ng-soft);border-color:var(--ng)}
.fb .head{font-weight:800;font-size:19px;margin:0 0 4px}
.fb p{margin:4px 0}
.fb .ja{color:var(--ink-soft);font-size:15px}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.cell{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:6px 4px 8px;text-align:center}
.cell svg{width:100%;height:auto}
.cell b{display:block;font-size:15px}
.cell small{display:block;font-size:12px;color:var(--ink-soft);line-height:1.3}
.cell.gold{border-color:#E2B33C;box-shadow:inset 0 0 0 2px #F6D77A}
.cell.unknown{opacity:.55}
.sp{margin:18px 0 4px;font-size:18px;font-weight:800}
.sp small{font-weight:400;color:var(--ink-soft);font-size:14px;margin-left:6px}
.note{font-size:14px;color:var(--ink-soft);margin:6px 2px 0}
.prog{height:10px;border-radius:999px;background:var(--card);border:2px solid var(--line);overflow:hidden;margin:4px 0 12px}
.prog i{display:block;height:100%;background:var(--pink);transition:width .3s}
.big{font-size:40px;font-weight:800;text-align:center;margin:4px 0 0;letter-spacing:.03em}
.bigm{text-align:center;color:var(--ink-soft);margin:0 0 6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair label{font-size:14px;font-weight:700;color:var(--ink-soft)}
.pair input.type{margin-top:4px;font-size:20px}
.pair input.right{border-color:var(--ok);background:var(--ok-soft)}
.pair input.wrong{border-color:var(--ng);background:var(--ng-soft)}
.miss{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 14px;margin-top:10px}
.miss li{margin:2px 0}
.fl{display:block;font-size:14px;font-weight:700;color:var(--ink-soft);margin-top:8px}
input.type.sm{font-size:17px;min-height:46px;margin-top:4px}
.sel{display:block;width:100%;min-height:46px;margin-top:4px;border:2px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:6px 10px}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:6px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.bar2{width:100%;background:var(--pink-soft);border-radius:4px 4px 0 0;display:flex;flex-direction:column;justify-content:flex-end;min-height:2px}
.bok{background:var(--ok);border-radius:4px 4px 0 0}
.bcol small{font-size:11px;color:var(--ink-soft)}
.rank{margin:4px 0 0;padding-left:1.4em}
.wl{margin-top:12px}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px;margin-top:8px}
.wrow.off{opacity:.55}
.wrow small{color:var(--ink-soft);font-size:12px}
.wbtn{display:flex;gap:6px;flex-shrink:0}
.mini{min-height:40px;min-width:56px;border:2px solid var(--line);border-radius:10px;background:var(--btn);font-weight:700;font-size:14px}
.gap{color:var(--ink-soft);font-size:15px}
.prevline{color:var(--ink-soft);font-size:15px;margin:0 0 8px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.q .ja{color:var(--ink-soft);font-size:15px;margin:4px 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.toggles{display:flex;gap:8px;margin-top:12px}
.tg{flex:1;min-height:44px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-weight:700;font-size:15px}
.tg[aria-pressed="true"]{border-color:var(--pink);background:var(--pink-soft)}
.reveal{display:flex;justify-content:center;align-items:flex-end;gap:4px;position:relative;z-index:1}
.reveal figure{margin:0;width:32%}
.reveal svg{width:100%;height:auto}
.reveal figcaption{font-weight:800;font-size:17px}
.reveal figure:nth-child(2) svg{animation-delay:.35s}
.reveal figure:nth-child(3) svg{animation-delay:.7s}
.reveal svg.appear{animation-fill-mode:both}
.who{position:relative;z-index:1;font-weight:800;font-size:18px;margin-top:4px}
.who small{display:block;font-weight:400;font-size:14px;color:var(--ink-soft)}
</style>
</head>

function rebuild(){
  const custom = S.custom || {};
  ALL = BASE.map(w=>custom[w.b]||w).concat(Object.values(custom).filter(c=>!BASE.some(x=>x.b===c.b)));
  const idx = {}; BASE.forEach((x,i)=>{ idx[x.b] = i; });
  PLAY = ALL.filter(w=>!(S.off||{})[w.b]);
  W = PLAY.filter(w=>!(w.b in idx) || idx[w.b] < S.unlocked);
  BY = Object.fromEntries(ALL.map(w=>[w.b,w]));
}

/* ---------- 音（Web Audio で合成。音声ファイルは使わない） ---------- */
const AU = {ctx:null, master:null, bgm:null, lp:null, sfx:null, noise:null, timer:null, step:0, next:0, playing:false};
const mtof = n=>440*Math.pow(2,(n-69)/12);
function audio(){
  if(!AU.ctx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    try{
      const c = AU.ctx = new AC();
      AU.master = c.createGain(); AU.master.gain.value = .8; AU.master.connect(c.destination);
      AU.bgm = c.createGain(); AU.bgm.gain.value = .32; AU.bgm.connect(AU.master);
      AU.lp = c.createBiquadFilter(); AU.lp.type = "lowpass"; AU.lp.frequency.value = 1900; AU.lp.connect(AU.bgm);
      AU.sfx = c.createGain(); AU.sfx.gain.value = .55; AU.sfx.connect(AU.master);
      const buf = c.createBuffer(1, c.sampleRate*.05, c.sampleRate);
      const d = buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
      AU.noise = buf;
    }catch(e){ AU.ctx = null; return null; }
  }
  if(AU.ctx.state==="suspended") AU.ctx.resume();
  return AU.ctx;
}
function tone(dest, n, t, dur, type, vol, slideTo){
  const c = AU.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(mtof(n), t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(mtof(slideTo), t+dur);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+.012);
  g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+.03);
}
function tick(t){
  const c = AU.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = AU.noise; f.type = "highpass"; f.frequency.value = 6000;
  g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(.0001, t+.04);
  s.connect(f); f.connect(g); g.connect(AU.bgm); s.start(t);
}
/* 8小節のループ。1マス＝8分音符、0は休み */
const MEL = [76,79,81,79,76,0,74,76, 79,0,76,74,72,0,0,0, 74,76,79,81,84,81,79,76, 74,0,76,74,72,0,74,0,

const BASS = [48,48,45,45,41,41,43,43, 48,48,45,45,41,43,48,48];
const STEP = .25;
function schedule(){
  const c = AU.ctx;
  while(AU.next < c.currentTime + .15){
    const s = AU.step % 64, t = AU.next;
    if(MEL[s]) tone(AU.lp, MEL[s], t, STEP*.9, "square", .09);
    if(s%4===0) tone(AU.bgm, BASS[s/4] - 12, t, STEP*1.8, "triangle", .35);
    if(s%4===2) tick(t);
    AU.step++; AU.next += STEP;
  }
}
function startBGM(){

function sfx(kind){

  if(kind==="ok"){ tone(d,88,t,.12,"square",.12); tone(d,93,t+.1,.22,"square",.12); }
  else if(kind==="ng"){ tone(d,67,t,.18,"triangle",.3); tone(d,63,t+.16,.3,"triangle",.3); }
  else if(kind==="evolve"){ [72,76,79,84,88].forEach((n,i)=>tone(d,n,t+i*.07,.14,"square",.1)); }
  else if(kind==="appear"){ tone(d,67,t,.18,"sine",.3,79); }
  else if(kind==="tap"){ tone(d,96,t,.04,"sine",.12); }
  else if(kind==="fanfare"){ [72,76,79].forEach((n,i)=>tone(d,n,t+i*.11,.12,"square",.11)); tone(d,84,t+.33,.45,"square",.12); tone(d,79,t+.33,.45,"triangle",.3); }

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const shuffle = a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a=>a[Math.floor(Math.random()*a.length)];
function regular(b){
  if(/e$/.test(b)) return b+"d";
  if(/[^aeiou]y$/.test(b)) return b.slice(0,-1)+"ied";
  if(b.length<=4 && /[^aeiou][aeiou][bdgmnprt]$/.test(b)) return b+b.slice(-1)+"ed";
  return b+"ed";
}
const SIMILAR = {bought:["brought","thought"],brought:["bought","thought"],thought:["taught","bought"],taught:["thought","caught"],caught:["taught","bought"]};
function ansOf(w, step){ const ex = step==="p" ? w.pe : w.ppe; return (ex && ex.t && ex.a) || (step==="p" ? w.p : w.pp); }
function accOf(w, step){
  const ex = step==="p" ? w.pe : w.ppe;
  if(ex && ex.t && ex.ok) return ex.ok;
  return step==="p" ? [w.p] : [w.pp, ...(w.ppAlt||[])];
}

/* ---------- 新しいモンスターの登場 ---------- */
function checkUnlock(){
  if(S.unlocked >= BASE.length) return 0;
  const names = new Set(BASE.map(x=>x.b));
  const pool = W.filter(w=>names.has(w.b));
  if(!pool.length || !pool.every(w=>S.words[w.b] && S.words[w.b].met)) return 0;
  const good = pool.filter(w=>S.words[w.b].nk>=4).length;
  if(good / pool.length * 100 < S.settings.unlockRate) return 0;
  const before = S.unlocked;
  S.unlocked = Math.min(BASE.length, S.unlocked + 5);
  rebuild();
  return S.unlocked - before;
}

/* ---------- 出題の選び方 ---------- */
const session = {count:0, retry:[], last:null, streak:0};
function nextWord(){
  session.count++;
  const r = session.retry.findIndex(x=>x.at<=session.count && x.b!==session.last);
  if(r>=0){ const b = session.retry.splice(r,1)[0].b; return {b, review:false}; }
  const now = Date.now();
  const due = W.filter(w=>{const x=S.words[w.b]; return x&&x.met&&x.due<=now&&w.b!==session.last;})
               .sort((a,b)=>S.words[a.b].due-S.words[b.b].due);
  if(due.length) return {b:due[0].b, review:false};
  const unmet = W.filter(w=>!(S.words[w.b]&&S.words[w.b].met));
  const fresh = unmet.find(w=>!(S.words[w.b] && S.words[w.b].nk>=4)) || unmet[0];
  if(fresh) return {b:fresh.b, review:false};
  const rest = W.filter(w=>w.b!==session.last).sort((a,b)=>S.words[a.b].due-S.words[b.b].due);
  return {b:rest[0].b, review:true};
}

/* ---------- 問題づくり ---------- */
function formOptions(w, step, forceAns, forceAcc){
  const ans = forceAns || ansOf(w, step);
  let c = [regular(w.b), step==="p"?w.pp:w.p, w.b, step==="pp"?w.pp:w.p, ...(SIMILAR[ans]||[]), w.p+(w.p.endsWith("e")?"n":"en")];
  const alts = forceAcc ? forceAcc : accOf(w, step).concat(step==="pp" ? (w.ppAlt||[]) : []);
  c = [...new Set(c)].filter(x=>x!==ans && !alts.includes(x));
  c = shuffle(c).slice(0,3);
  for(let k=0; c.length<3 && k<200; k++){ const o = pick(ALL)[step==="p"?"p":"pp"]; if(o!==ans && !c.includes(o)) c.push(o); }
  const fake = ["goed","taked","seened","wented","maked"];
  for(let k=0; c.length<3 && k<fake.length; k++) if(fake[k]!==ans && !c.includes(fake[k])) c.push(fake[k]);
  return shuffle([ans, ...c]);
}
function meaningOptions(w){
  const tok = m=>m.split("・").map(s=>s.replace(/[（）()]/g,""));
  const mine = tok(w.m);
  const others = [...new Set(shuffle(ALL.filter(x=>!tok(x.m).some(t=>mine.includes(t)))).map(x=>x.m))].slice(0,3);
  return shuffle([w.m, ...others]);
}
function tilesFor(ans, w){
  const pool = ans.split("");
  const extra = [];
  const count = s=>{const o={};for(const ch of s)o[ch]=(o[ch]||0)+1;return o;};
  const have = count(ans);
  for(const ch of regular(w.b)){ if(!(have[ch]>0) && !extra.includes(ch)) extra.push(ch); }
  if(/[ou]ght$|aught$/.test(ans)) extra.unshift("r");
  ["e","d","n"].forEach(ch=>{ if(!extra.includes(ch)) extra.push(ch); });
  const decoys = extra.slice(0,3);
  return shuffle([...pool, ...decoys]);
}
function highlight(text, cues){
  let h = esc(text);
  cues.forEach(cue=>{
    const re = new RegExp("(^|[^A-Za-z])(" + esc(cue).replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")(?![A-Za-z])","i");
    h = h.replace(re, (m,a,b)=>`${a}<mark class="cue">${b}</mark>`);
  });
  return h;
}
function sentenceHTML(ex, filled, showCues){
  const [a,b] = ex.t.split("{}");
  const ha = showCues ? highlight(a, ex.c||[]) : esc(a);
  const hb = showCues ? highlight(b, ex.c||[]) : esc(b);
  const mid = filled ? `<span class="ans">${esc(filled)}</span>` : `<span class="blank" aria-label="空欄">？</span>`;
  return ha + mid + hb;
}
function explain(ex, ans){
  const cue = (ex.c||[]).length ? ex.c.map(x=>`「${x}」`).join("と") : "文の形";
  switch(ex.g){
    case "past": return `${cue}があるから過去の話。過去形の ${ans} を使う。`;
    case "agree": return `${cue}が過去の形なので、時制をそろえて過去形の ${ans} にする。`;
    case "perfect": return `${cue}＋過去分詞で現在完了。「今までに〜した・ずっと〜している」を表す。過去分詞は ${ans}。`;
    case "pastPerfect": return `${cue}から、had＋過去分詞の過去完了。過去のある時点より前のことを表す。過去分詞は ${ans}。`;
    case "passive": return `${cue}の後に過去分詞で受け身。「〜される・〜されている」を表す。過去分詞は ${ans}。`;
    case "modalPassive": return `${cue}＋過去分詞で「〜されることができる・〜される」。過去分詞は ${ans}。`;
    case "perfectPassive": return `${cue}＋過去分詞で、現在完了の受け身。「〜されてきた・〜されている」を表す。過去分詞は ${ans}。`;
    case "narr": return `物語は過去のできごとを話しているので、過去形の ${ans} を使う。`;
    case "participleBefore": return `過去分詞の ${ans} が${cue}を前から説明して、「〜した・〜された…」の意味になる。`;
    case "progressivePassive": return `${cue}＋過去分詞で進行形の受け身。「〜されているところ」を表す。過去分詞は ${ans}。`;
    case "getPassive": return `${cue}＋過去分詞で「〜された状態になる」。過去分詞は ${ans}。`;
    case "participle": return `過去分詞の ${ans} が${cue}を後ろから説明して、「〜された…」の意味になる。`;
  }
  return "";
}

      <div id="pfb"></div>
      <div class="row" id="pbtns"><button class="btn sec" id="idk">わからない</button><button class="btn" id="ok">答える</button></div>
    </div>`;
  wireMusicButton();
  $("#quit").onclick = ()=>{ if(P.res.length) placementEnd(); else home(); };
  const i1 = $("#i1"), i2 = $("#i2");
  i1.focus({preventScroll:true});
  [i1,i2].forEach(x=>x.oninput = ()=>{ $("#err").textContent = ""; });
  i1.onkeydown = e=>{ if(e.key==="Enter"){ e.preventDefault(); i2.focus(); } };
  i2.onkeydown = e=>{ if(e.key==="Enter"){ e.preventDefault(); placementSubmit(false); } };
  $("#ok").onclick = ()=>placementSubmit(false);
  $("#idk").onclick = ()=>placementSubmit(true);
}
function placementSubmit(dontKnow){
  const w = P.order[P.i];
  const norm = s=>s.trim().toLowerCase().replace(/\s+/g," ");
  const v1 = norm($("#i1").value), v2 = norm($("#i2").value);
  if(!dontKnow){
    if(!v1 || !v2){ $("#err").textContent = "両方書くか、「わからない」を押してね"; return; }
    if(!/^[a-z' ]+$/.test(v1+v2)){ $("#err").textContent = "英語のアルファベットで書いてね"; return; }
  }
  const okP = !dontKnow && v1===w.p;
  const okPP = !dontKnow && (v2===w.pp || (w.ppAlt||[]).includes(v2));
  P.res.push({w, okP, okPP});
  $("#i1").disabled = true; $("#i2").disabled = true;
  $("#i1").classList.add(okP?"right":"wrong"); $("#i2").classList.add(okPP?"right":"wrong");
  $("#pbtns").innerHTML = "";
  const both = okP && okPP;
  sfx(both ? "ok" : "ng");
  const advance = ()=>{ P.i++; if(P.i<P.order.length) placementQ(); else placementEnd(); };
  if(both){
    $("#pfb").innerHTML = `<div class="fb ok"><p class="head">正解！</p></div>`;
    setTimeout(advance, 700);
  }else{
    $("#pfb").innerHTML = `<div class="fb ng"><p class="head">${dontKnow?"答えはこれ":"おしい"}</p><p>${esc(w.b)} – ${esc(w.p)} – ${esc(w.pp)}</p></div><button class="btn" id="nx">つぎへ</button>`;
    $("#nx").onclick = advance;
    $("#nx").focus({preventScroll:true});
  }
}
function placementEnd(){
  let known = 0, half = 0;
  const miss = [];
  P.res.forEach(({w, okP, okPP})=>{
    const r = rec(w.b);
    if(okP && okPP){ r.nk = Math.max(r.nk, 4); known++; }
    else if(okP || okPP){ r.nk = Math.max(r.nk, 2); half++; miss.push(w); }
    else { miss.push(w); }
  });
  S.placed = true; save();
  sfx("fanfare");
  const list = miss.map(w=>`<li>${esc(w.b)} – ${esc(w.p)} – ${esc(w.pp)}（${esc(w.m)}）</li>`).join("");
  $("#app").innerHTML = `
    <div class="bar"><span class="chip">実力チェックの結果</span>${musicButton()}</div>
    <div class="stats">
      <div class="stat"><b>${known}</b><span>両方書けた</span></div>
      <div class="stat"><b>${half}</b><span>片方だけ</span></div>
      <div class="stat"><b>${P.res.length-known-half}</b><span>まだこれから</span></div>
    </div>
    <div class="fb ok"><p>両方書けた単語は手入力から、片方だけの単語はタイルから、まだの単語は4択から始まるよ。あやふやな単語から先に出てくるよ。</p></div>
    ${miss.length ? `<div class="miss"><b>これから覚える単語</b><ul>${list}</ul></div>` : `<div class="fb ok"><p class="head">全部書けた！</p><p>手入力でどんどん図鑑を集めよう。</p></div>`}
    <button class="btn" id="go">草むらへ出かける</button>
    <button class="btn sec" id="home2">ホームにもどる</button>`;

  $("#go").onclick = ()=>{ startBGM(); startEncounter(); };
  $("#home2").onclick = home;
}

/* ---------- 画面：図鑑 ---------- */
function dex(){

  const groups = ["AAA","ABB","ABA","ABC"];

      const r = S.words[w.b];

        html += `<div class="cell ${r.nk>=6?"gold":""}">${monsterSVG(g, Math.min(r.best,2), "", w.b)}<b>${esc(w.b)}</b><small>${esc(w.p)} / ${esc(w.pp)}<br>${esc(w.m)}${S.off[w.b]?"<br>お休み中":""}</small></div>`;
      }else{
        html += `<div class="cell unknown"><svg viewBox="-62 -56 124 100" aria-label="まだ出会っていない"><circle r="30" fill="#C9D1D6"/><text x="0" y="10" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">？</text></svg><b>？？？</b><small>まだ出会っていない</small></div>`;
      }

/* ---------- 画面：バトル ---------- */
let E = null;
function startEncounter(){
  if(lockActive()) return lockScreen();
  SCREEN = "battle";
  const {b, review} = nextWord();
  session.last = b;
  const w = BY[b], r = rec(b);
  E = {w, sp:species(w), r, review, isNew:!r.met, steps:["m","p","pp"], i:0, stage:0,
       mode:modeFor(r.nk), wrong:false, hinted:false, tries:0, anim:"appear", answered:false, built:[]};
  renderBattle();
}
function hearts(nk){ let h=""; for(let i=0;i<6;i++) h+=`<i class="${i<nk?"on":""}"></i>`; return `<div class="hearts" aria-label="なつき度 ${nk}／6">${h}</div>`; }
function formsLine(){
  const w=E.w; const parts=[w.b]; if(E.stage>=1) parts.push(w.p); if(E.stage>=2) parts.push(w.pp);
  return parts.join(" – ");
}
function battleTop(){
  const tag = E.isNew ? "はじめて出会った！" : E.review ? "おさらい" : "また出てきた！";
  return `
  <div class="bar"><button class="link" id="back">‹ ホーム</button><span class="chip">連続正解 ${session.streak}${timeChip()}</span>${musicButton()}</div>
  <div class="field">
    <span class="tag">${tag}　${MODE_NAME[E.mode]}</span><br>
    ${shadowSVG(E.stage, "mon "+(E.anim||""))}
    <div class="word">${esc(E.stage===0?E.w.b:E.stage===1?E.w.p:E.w.pp)}</div>
    <div class="forms">${esc(formsLine())}</div>
    ${hearts(E.r.nk)}
  </div>`;
}
function renderBattle(){
  const step = E.steps[E.i];
  let q = "";
  if(step==="m"){
    q = `<div class="q"><h2>${esc(E.w.b)} の意味は？</h2><div class="opts">${meaningOptions(E.w).map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>`;
  }else{
    const ex = step==="p" ? E.w.pe : E.w.ppe;
    const nm = step==="p" ? "過去形" : "過去分詞";
    q = ex && ex.t
      ? `<div class="q"><h2>${nm}にして空欄に入れよう（${esc(E.w.b)}）</h2><p class="sent">${sentenceHTML(ex,null,false)}</p><div id="ansArea"></div></div>`
      : `<div class="q"><h2>${esc(E.w.b)} の${nm}は？</h2><div id="ansArea"></div></div>`;
  }
  $("#app").innerHTML = battleTop() + q + `<div id="fb"></div>`;
  if(E.anim==="appear") sfx("appear");
  E.anim = "";
  $("#back").onclick = ()=>{ save(); home(); };
  wireMusicButton();
  if(step==="m"){
    document.querySelectorAll(".opt").forEach(bt=>bt.onclick=()=>answerMeaning(bt));
  }else{
    E.tries = 0; E.built = [];
    renderAnswerArea();
  }
}
function renderAnswerArea(){
  const step = E.steps[E.i];
  const ans = ansOf(E.w, step);
  const area = $("#ansArea");
  if(E.mode==="choice"){
    area.innerHTML = `<div class="opts">${formOptions(E.w, step).map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
    area.querySelectorAll(".opt").forEach(bt=>bt.onclick=()=>{
      area.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(x.dataset.v===ans) x.classList.add("right");});
      const ok = bt.dataset.v===ans; if(!ok) bt.classList.add("wrong");
      judge(ok, bt.dataset.v);
    });
  }else if(E.mode==="tiles"){
    const tiles = tilesFor(ans, E.w);
    E.tiles = tiles.map((ch,i)=>({ch,i,used:false}));
    drawTiles();
  }else{
    area.innerHTML = `<input class="type" id="typed" type="text" inputmode="latin" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="答えを入力"><div class="err" id="err"></div><div id="hintBox"></div><button class="btn" id="send">これで答える</button>`;
    const inp = $("#typed");
    inp.focus({preventScroll:true});
    inp.oninput = ()=>{ $("#err").textContent=""; };
    inp.onkeydown = e=>{ if(e.key==="Enter"){ e.preventDefault(); submitTyped(); } };
    $("#send").onclick = submitTyped;
  }
}
function drawTiles(){
  const area = $("#ansArea");
  area.innerHTML = `<div class="slots" aria-label="作った答え">${E.built.map((t,k)=>`<button class="slot" data-k="${k}" aria-label="${esc(t.ch)} を外す">${esc(t.ch)}</button>`).join("")}</div>
    <div class="tiles">${E.tiles.map(t=>`<button class="tile" data-i="${t.i}" ${t.used?"disabled":""}>${esc(t.ch)}</button>`).join("")}</div>
    <div class="err" id="err"></div>
    <div class="row"><button class="btn sec" id="clr">やり直す</button><button class="btn" id="send">これで答える</button></div>`;
  area.querySelectorAll(".tile").forEach(bt=>bt.onclick=()=>{
    sfx("tap"); const t = E.tiles.find(x=>x.i==bt.dataset.i); t.used=true; E.built.push(t); drawTiles();
  });
  area.querySelectorAll(".slot").forEach(bt=>bt.onclick=()=>{
    const t = E.built.splice(+bt.dataset.k,1)[0]; t.used=false; drawTiles();
  });
  $("#clr").onclick = ()=>{ E.built.forEach(t=>t.used=false); E.built=[]; drawTiles(); };
  $("#send").onclick = ()=>{
    if(!E.built.length){ $("#err").textContent="タイルをタップして答えを作ろう"; return; }
    const step = E.steps[E.i]; const ans = ansOf(E.w, step);
    const v = E.built.map(t=>t.ch).join("");
    area.querySelectorAll("button").forEach(x=>x.disabled=true);
    judge(v===ans, v);
  };
}
function submitTyped(){
  const v = $("#typed").value.trim().toLowerCase().replace(/\s+/g," ");
  if(!v){ $("#err").textContent="答えを入力してから押してね"; return; }
  if(!/^[a-z' ]+$/.test(v)){ $("#err").textContent="英語のアルファベットで入力してね"; return; }
  const step = E.steps[E.i]; const ans = ansOf(E.w, step);
  if(accOf(E.w, step).includes(v)){ lockTyped(); judge(true, v); return; }
  E.tries++;
  if(E.tries===1){
    E.hinted = true;
    $("#hintBox").innerHTML = `<div class="hint">ヒント：${esc(SP_INFO[E.sp].hint)}</div>`;
    $("#err").textContent = "ちがうみたい。ヒントを見てもう一度";
    $("#typed").select();
  }else if(E.tries===2){
    $("#hintBox").innerHTML += `<div class="hint">ヒント：最初の文字は「${esc(ans[0])}」</div>`;
    $("#err").textContent = "おしい。あと1回";
    $("#typed").select();
  }else{
    lockTyped(); judge(false, v);
  }
}
function lockTyped(){ $("#typed").disabled = true; $("#send").disabled = true; }

function answerMeaning(bt){
  const ok = bt.dataset.v===E.w.m;
  document.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(x.dataset.v===E.w.m) x.classList.add("right");});
  if(!ok) bt.classList.add("wrong");
  logAnswer(ok);
  if(!ok) E.wrong = true;
  session.streak = ok ? session.streak+1 : 0;
  sfx(ok?"ok":"ng");
  const head = ok ? "なかよくなれた！" : "おしい！";
  $("#fb").innerHTML = `<div class="fb ${ok?"ok":"ng"}"><p class="head">${head}</p><p>${esc(E.w.b)} は「${esc(E.w.m)}」。</p></div><button class="btn" id="next">つぎへ</button>`;
  $("#next").onclick = ()=>{ E.i++; renderBattle(); };
  $("#next").focus({preventScroll:true});
}
function judge(ok, given){
  const step = E.steps[E.i];
  const ex = step==="p" ? E.w.pe : E.w.ppe;
  const ans = ansOf(E.w, step);
  logAnswer(ok);
  if(!ok) E.wrong = true;
  session.streak = ok ? session.streak+1 : 0;
  sfx(ok?"ok":"ng");
  const hasEx = ex && ex.t;
  if(hasEx) $(".sent").innerHTML = sentenceHTML(ex, ans, true);
  let head;
  if(ok){ head = step==="p" ? "正解！進化するよ" : "正解！さいごの進化だ"; }
  else  { head = `おしい！正しくは ${esc(ans)}`; }
  const yours = (!ok && given) ? `<p>あなたの答え：${esc(given)}</p>` : "";
  $("#fb").innerHTML = `<div class="fb ${ok?"ok":"ng"}"><p class="head">${head}</p>${yours}${hasEx ? `<p>${esc(explain(ex, ans))}</p>${ex.note?`<p>${esc(ex.note)}</p>`:""}${ex.ja?`<p class="ja">${esc(ex.ja)}</p>`:""}` : `<p>${esc(E.w.b)} – ${esc(E.w.p)} – ${esc(E.w.pp)}</p>`}</div><button class="btn" id="next">${ok?"進化させる":"つぎへ"}</button>`;
  $("#next").onclick = ()=>{
    if(ok){ E.stage = step==="p"?1:2; E.anim="evolve"; sfx("evolve"); }
    E.i++;
    if(E.i>=E.steps.length) finish(); else renderBattle();
  };
  $("#next").focus({preventScroll:true});
}
function finish(){
  const r = E.r, now = Date.now();
  const firstMeet = !r.met;
  r.met = true;
  r.best = Math.max(r.best, E.stage);
  let msg;
  if(E.wrong){
    r.nk = Math.max(0, r.nk-1); r.streak = 0; r.wrong++;
    r.due = now + 3*DAY;
    session.retry.push({b:E.w.b, at:session.count+3});
    msg = `${E.w.b} は逃げてしまった。少しあとと、3日後にまた出てくるよ。`;
  }else if(E.review){
    msg = `おさらい完了。${E.w.b} は元気いっぱい。`;
  }else if(E.hinted){
    r.due = now + DAY;
    msg = `${E.w.b} が仲間になった！ヒントを使ったので、なつき度はそのまま。明日また会おう。`;
  }else{
    r.nk = Math.min(6, r.nk+1); r.streak++;
    const iv = [1,3,7,14,30][Math.min(r.streak-1,4)];
    r.due = now + iv*DAY;
    msg = r.nk===6 ? `${E.w.b} が卒業した！図鑑に金色の枠が付いたよ。` : `${E.w.b} が仲間になった！なつき度が上がった。次は${iv}日後に会えるよ。`;
    if(firstMeet) msg = `${E.w.b} が仲間になって、図鑑に登録された！`;
  }
  const added = checkUnlock();
  if(added) msg += ` 新しいモンスターが${added}匹、草むらに現れた！`;
  STORY.forEach((c,i)=>{ if(chapterOpen(i) && !S.story[i] && !S.storySeen[i]){ S.storySeen[i] = true; msg += ` ストーリー第${i+1}章が読めるようになった！`; } });
  save();
  const w = E.w, sp = E.sp;
  const why = {AAA:"3つとも同じ形", ABB:"過去と過去分詞が同じ形", ABA:"過去分詞で原形の形に戻る", ABC:"3つとも違う形"}[sp];
  $("#app").innerHTML = `
    <div class="bar"><button class="link" id="back">‹ ホーム</button><span class="chip">連続正解 ${session.streak}</span>${musicButton()}</div>
    <div class="field">
      <span class="tag">正体がわかった！</span>
      <div class="reveal">
        <figure>${monsterSVG(sp,0,"appear",w.b)}<figcaption>${esc(w.b)}</figcaption></figure>
        <figure>${monsterSVG(sp,1,"appear",w.p)}<figcaption>${esc(w.p)}</figcaption></figure>
        <figure>${monsterSVG(sp,2,"appear",w.pp)}<figcaption>${esc(w.pp)}</figcaption></figure>
      </div>
      <div class="who">${SP_INFO[sp].name}だった！<small>${why}なかま（${esc(w.m)}）</small></div>
      ${hearts(r.nk)}
    </div>
    <div class="fb ${E.wrong?"ng":"ok"}"><p class="head">${E.wrong?"またね…":"やったね！"}</p><p>${esc(msg)}</p></div>
    <button class="btn" id="more">次のモンスターを探す</button><button class="btn sec" id="home2">ホームにもどる</button>`;
  sfx(E.wrong ? "bye" : "fanfare");
  wireMusicButton();
  $("#back").onclick = home;
  $("#more").onclick = startEncounter;
  $("#home2").onclick = home;
  $("#more").focus({preventScroll:true});
}

 {title:"村の市場", lines:[

  [`We [run:p:agree:was] all the way there because it was already crowded.`, `もう混んでいたので、私たちはずっと走っていった。`],
  [`I [buy:p:narr:] three shiny apples and [put:p:narr:] them in my bag.`, `私はぴかぴかのリンゴを3つ買って、かばんに入れた。`],
  [`A blue monster named Drop had [cut:pp:pastPerfect:had] some flowers from his garden and [bring:pp:pastPerfect:had] them to sell.`, `ドロップという青いモンスターが、庭の花を切って売りに持ってきていた。`],
  [`"I have [read:pp:perfect:have] every book in this village," Drop said proudly.`, `「ぼくはこの村の本を全部読んだことがあるんだ」とドロップは得意げに言った。`],
  [`I [think:p:agree:was] he was joking, but he wasn't.`, `冗談だと思ったけど、そうではなかった。`],
  [`We [have:p:narr:] lunch together under a big tree.`, `私たちは大きな木の下で一緒にお昼を食べた。`],
  [`By the end of the day, Drop had [become:pp:pastPerfect:had] my best friend.`, `その日の終わりには、ドロップは私の親友になっていた。`]
 ]},
 {title:"歌のお祭り", lines:[
  [`That evening, I [hear:p:past:That evening] music from the village square.`, `その夜、村の広場から音楽が聞こえた。`],
  [`Many monsters had [leave:pp:pastPerfect:had] their houses to join the festival.`, `たくさんのモンスターが、お祭りに加わるために家を出てきていた。`],
  [`There I [meet:p:narr:] a green monster named Leafy.`, `そこで私は、リーフィーという緑のモンスターに出会った。`],
  [`Leafy [speak:p:agree:were] very softly, but her songs were powerful.`, `リーフィーはとても小さな声で話したけれど、歌は力強かった。`],
  [`"This song was [write:pp:passive:was] by my grandmother," she said.`, `「この歌は私のおばあちゃんが書いたの」とリーフィーは言った。`],
  [`She [teach:p:narr:] me the words, and we [sing:p:narr:] it together.`, `リーフィーが歌詞を教えてくれて、私たちは一緒に歌った。`],
  [`I have never [feel:pp:perfect:have never] so happy before!`, `こんなに楽しい気持ちになったのは初めて！`],
  [`Suddenly, a strong wind [catch:p:agree:ran] my hat, and Leafy ran after it.`, `突然、強い風が帽子をさらい、リーフィーが追いかけてくれた。`],
  [`"Have you ever [do:pp:perfect:Have;ever] anything this fun?" Drop asked.`, `「こんなに楽しいこと、今までにしたことある？」とドロップがたずねた。`]
 ]},
 {title:"湖の朝", lines:[
  [`I [sleep:p:past:that night] very well that night.`, `その夜はとてもよく眠れた。`],
  [`In the morning, the village bell [ring:p:past:In the morning] at six.`, `朝6時に、村の鐘が鳴った。`],
  [`The sun had just [begin:pp:pastPerfect:had just] to rise when we arrived at the lake.`, `私たちが湖に着いたとき、太陽はちょうど昇り始めたところだった。`],
  [`Sunny [fly:p:narr:] over the water with her little wings.`, `サニーが小さな羽で湖の上を飛んだ。`],
  [`"I have [swim:pp:perfect:have] in this lake since I was a baby," Drop said.`, `「ぼくは赤ちゃんのころから、この湖で泳いでいるんだ」とドロップが言った。`],
  [`We [sit:p:narr:] on a rock and [drink:p:narr:] warm milk.`, `私たちは岩に座って、温かいミルクを飲んだ。`],
  [`Momo [stand:p:narr:] up and pointed at the sky. A rainbow!`, `モモが立ち上がって空を指さした。虹だ！`],
  [`I have [keep:pp:perfect:have;ever since] a photo of that rainbow ever since.`, `それ以来ずっと、私はその虹の写真を持っている。`],
  [`I think I have [get:pp:perfect:have] used to life in the village.`, `村での暮らしにも、すっかり慣れてきた気がする。`]
 ]},
 {title:"ボート大会", lines:[
  [`A boat race is [hold:pp:passive:is] on the lake every summer.`, `毎年夏、湖でボート大会が開かれる。`],
  [`Drop and I [spend:p:narr:] a whole week making a boat.`, `ドロップと私は、まる1週間かけてボートを作った。`],
  [`Our boat was [build:pp:passive:was] with wood from the forest.`, `私たちのボートは森の木で作られた。`],
  [`Momo [lend:p:narr:] us her paint, so we made it pink and blue.`, `モモが絵の具を貸してくれたので、ピンクと青に塗った。`],
  [`Sunny had [send:pp:pastPerfect:had] invitations to every monster in the village.`, `サニーは村じゅうのモンスターに招待状を送っていた。`],
  [`Some monsters [sell:p:narr:] snacks, and I [pay:p:narr:] ten coins for a cookie.`, `お菓子を売るモンスターもいて、私はクッキーにコインを10枚払った。`],
  [`We almost [lose:p:narr:] the race because of a big wave, but in the end we [win:p:narr:]!`, `大きな波のせいで負けそうになったけど、最後には私たちが勝った！`],
  [`Finally, I [understand:p:narr:] why everyone loved this village so much.`, `やっと、みんながこの村を大好きな理由が分かった。`]
 ]},
 {title:"嵐の夜", lines:[
  [`One night, a big storm [hit:p:past:One night] the village.`, `ある夜、大きな嵐が村を襲った。`],
  [`We [shut:p:narr:] all the windows and doors.`, `私たちは窓とドアを全部閉めた。`],
  [`Leafy's grandmother [let:p:narr:] us stay in her house.`, `リーフィーのおばあちゃんが、家に泊めてくれた。`],
  [`She [show:p:narr:] us an old map that was [draw:pp:passive:was] by her grandfather.`, `おばあちゃんは、自分のおじいさんが描いた古い地図を見せてくれた。`],
  [`"The magic tea tree has [grow:pp:perfect:has] here for 300 years," she said.`, `「魔法のお茶の木は、300年間ここで育ってきたのよ」とおばあちゃんは言った。`],
  [`Suddenly, the wind [throw:p:narr:] a branch against the window.`, `突然、風が枝を窓にたたきつけた。`],
  [`Nobody was [hurt:pp:passive:was], but the glass was broken.`, `けがをした人はいなかったけれど、ガラスは割れてしまった。`],
  [`Fixing the window [cost:p:past:the next day] us fifty coins the next day.`, `次の日、窓の修理にはコインが50枚かかった。`],
  [`Before going to bed, I [set:p:narr:] my alarm for five o'clock.`, `寝る前に、私は目覚ましを5時にセットした。`]
 ]},
 {title:"消えた葉っぱ", lines:[
  [`I [wake:p:agree:heard] up early because I heard a strange sound.`, `変な音が聞こえたので、私は早く目が覚めた。`],
  [`Someone had [hide:pp:pastPerfect:had] all the leaves of the magic tea tree!`, `誰かが、魔法のお茶の木の葉を全部隠してしまっていた！`],
  [`We [ride:p:narr:] our bikes around the village to look for them.`, `私たちは自転車で村じゅうを探し回った。`],
  [`The sun had already [rise:pp:pastPerfect:had already] when we found a trail of leaves.`, `葉っぱの跡を見つけたとき、太陽はもう昇っていた。`],
  [`Some of the leaves were [bite:pp:passive:were] by tiny teeth.`, `葉っぱのいくつかは、小さな歯でかじられていた。`],
  [`The trail led to a small house with a [break:pp:participleBefore:window] window.`, `跡は、窓の割れた小さな家へと続いていた。`],
  [`Inside, a little monster [wear:p:narr:] a scarf made of tea leaves!`, `中では、小さなモンスターがお茶の葉でできたマフラーを巻いていた！`],
  [`"I'm sorry. I [forget:p:narr:] to ask," he said. "It was so cold that I [choose:p:agree:was] the warmest leaves."`, `「ごめんなさい。聞くのを忘れてたんだ」とその子は言った。「とても寒かったから、いちばん暖かい葉っぱを選んだの」`],
  [`Leafy's father [drive:p:narr:] us back to the tree in his old car with all the leaves.`, `リーフィーのお父さんが、葉っぱと一緒に私たちを古い車でお茶の木まで送ってくれた。`]

 {title:"お茶の木を救え", lines:[

  [`I finally understood what Leafy's grandmother [mean:p:agree:understood] by "magic."`, `リーフィーのおばあちゃんが「魔法」という言葉で何を言いたかったのか、やっと分かった。`],
  [`We [seek:p:narr:] advice from the oldest monster in the forest.`, `私たちは、森でいちばん年上のモンスターに助言を求めた。`],
  [`She [lead:p:narr:] us to a secret spring deep in the woods.`, `その人は、森の奥にある秘密の泉へ私たちを案内してくれた。`],
  [`"Many monsters have been [mislead:pp:perfectPassive:have been] by old stories about this spring," she warned.`, `「この泉の古い言い伝えに、たくさんのモンスターが惑わされてきたのよ」と、その人は注意した。`],
  [`A huge snake [lie:p:narr:] across the path, sleeping in the sun.`, `大きなヘビが、日なたで眠りながら道の上に横たわっていた。`],
  [`Drop carefully [lay:p:narr:] a blanket over it so it wouldn't wake up.`, `ドロップは、ヘビが起きないようにそっと毛布をかけた。`],
  [`"Long ago, monsters had [fight:pp:pastPerfect:had] over this water," she said.`, `「昔、モンスターたちはこの水をめぐって争っていたの」と、その人は言った。`],
  [`After we got home, we [feed:p:agree:got] the tree with the spring water.`, `家に帰ってから、私たちは泉の水をお茶の木にあげた。`],
  [`Every problem was [deal:pp:passive:was] with together.`, `どの問題も、みんなで一緒に対処した。`]
 ]},

 {title:"春の約束", lines:[
  [`By spring, the tea tree had [undergo:pp:pastPerfect:had] a big change. It was covered with new leaves!`, `春になると、お茶の木は大きく変わっていた。新しい葉でいっぱいだ！`],

  [`"Her mother has [bear:pp:perfect:has:borne] five babies," Drop added.`, `「そのお母さんは、これまでに5匹の赤ちゃんを産んでいるんだ」とドロップが付け加えた。`],

function parseLine(t){
  const segs = [], re = /\[([a-z]+):(pp|p):([A-Za-z]+):([^\]:]*)(?::([^\]]*))?\]/g;
  let last = 0, m;
  while((m = re.exec(t))){
    segs.push({s:t.slice(last, m.index)});
    segs.push({b:m[1], step:m[2], g:m[3], c:m[4] ? m[4].split(";") : [], acc:m[5] ? m[5].split(";") : null});
    last = re.lastIndex;
  }
  segs.push({s:t.slice(last)});
  return segs;
}
function chapterWords(ch){ return [...new Set(STORY[ch].lines.flatMap(l=>parseLine(l[0]).filter(x=>x.b).map(x=>x.b)))]; }
function chapterMissing(ch){ return chapterWords(ch).filter(b=>BY[b] && !S.off[b] && !(S.words[b] && S.words[b].met)); }
function chapterOpen(ch){ return chapterMissing(ch).length===0 && (ch===0 || !!S.story[ch-1]); }
function newChapterReady(){ return STORY.some((c,i)=>chapterOpen(i) && !S.story[i]); }

function storyList(){
  SCREEN = "storylist";
  const rows = STORY.map((c,i)=>{
    const open = chapterOpen(i), best = S.story[i];
    let right, sub;
    if(best){ sub = `クリア　${"★".repeat(best)}${"☆".repeat(3-best)}`; right = `<button class="mini" data-ch="${i}">もう一度</button>`; }
    else if(open){ sub = "読めるよ！"; right = `<button class="mini" data-ch="${i}">読む</button>`; }
    else if(i>0 && !S.story[i-1]){ sub = "前の章をクリアすると読めるよ"; right = ""; }
    else { const n = chapterMissing(i).length; sub = `あと${n}匹に出会うと読めるよ`; right = ""; }
    return `<div class="wrow ${open||best?"":"off"}"><div><b>第${i+1}章　${esc(c.title)}</b><br><small>${sub}</small></div><div class="wbtn">${right}</div></div>`;
  }).join("");
  $("#app").innerHTML = `<div class="bar"><button class="link" id="back">‹ ホーム</button><span class="chip">ストーリー</span>${musicButton()}</div>
    <p class="sub" style="margin-top:8px">モンスターの村の物語。空欄に、仲間にしたモンスターの単語を正しい形で入れて読み進めよう。</p>
    <div class="wl">${rows}</div>`;
  wireMusicButton();
  $("#back").onclick = home;
  document.querySelectorAll("[data-ch]").forEach(b=>b.onclick = ()=>storyStart(+b.dataset.ch));
}

let ST = null;
function storyStart(ch){
  if(lockActive()) return lockScreen();
  ST = {ch, li:0, bi:0, miss:0, n:0, tries:0, lines: STORY[ch].lines.map(l=>({segs:parseLine(l[0]), ja:l[1]}))};
  storyRender();
}
function blanksOf(line){ return line.segs.filter(x=>x.b); }
function lineHTML(line, upto, showCues){
  let k = 0;
  return line.segs.map(x=>{
    if(!x.b) return showCues ? highlight(x.s, blanksOf(line).flatMap(b=>b.c)) : esc(x.s);
    const i = k++;
    const ans = x.acc ? x.acc[0] : (x.step==="p" ? BY[x.b].p : BY[x.b].pp);
    if(i < upto) return `<span class="ans">${esc(ans)}</span>`;
    if(i === upto) return `<span class="blank" aria-label="空欄">？</span>`;
    return `<span class="gap" aria-label="あとの空欄">（${esc(x.b)}）</span>`;
  }).join("");
}
function storyRender(){
  SCREEN = "story";
  const line = ST.lines[ST.li], bl = blanksOf(line);
  const prev = ST.li>0 ? `<p class="prevline">${lineHTML(ST.lines[ST.li-1], 99, false)}</p>` : "";
  const head = `<div class="bar"><button class="link" id="back">‹ もどる</button><span class="chip">第${ST.ch+1}章　${ST.li+1}／${ST.lines.length}${timeChip()}</span>${musicButton()}</div>
    <div class="prog" aria-hidden="true"><i style="width:${ST.li/ST.lines.length*100}%"></i></div>`;
  if(!bl.length){
    $("#app").innerHTML = head + `<div class="q">${prev}<p class="sent">${esc(line.segs[0].s)}</p><p class="ja">${esc(line.ja)}</p></div><button class="btn" id="next">つぎへ</button>`;
    wireMusicButton(); $("#back").onclick = storyList;
    $("#next").onclick = storyNext;
    return;
  }
  const x = bl[ST.bi], w = BY[x.b];
  const nm = x.step==="p" ? "過去形" : "過去分詞";
  $("#app").innerHTML = head + `<div class="q">${prev}<h2>${esc(x.b)} を正しい形にして入れよう</h2><p class="sent" id="sline">${lineHTML(line, ST.bi, false)}</p><div id="ansArea"></div></div><div id="fb"></div>`;
  wireMusicButton(); $("#back").onclick = storyList;
  const ans = x.acc ? x.acc[0] : (x.step==="p" ? w.p : w.pp);
  const acc = x.acc || (x.step==="p" ? [w.p] : [w.pp, ...(w.ppAlt||[])]);
  const r = S.words[x.b], mode = modeFor(r ? r.nk : 0);
  const area = $("#ansArea");
  ST.tries = 0;
  if(mode==="choice"){
    area.innerHTML = `<div class="opts">${formOptions(w, x.step, ans, acc).map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
    area.querySelectorAll(".opt").forEach(bt=>bt.onclick = ()=>{
      area.querySelectorAll(".opt").forEach(z=>{ z.disabled = true; if(acc.includes(z.dataset.v)) z.classList.add("right"); });
      const ok = acc.includes(bt.dataset.v); if(!ok) bt.classList.add("wrong");
      storyJudge(ok, bt.dataset.v, x, ans);
    });
  }else if(mode==="tiles"){
    const tiles = tilesFor(ans, w).map((ch,i)=>({ch,i,used:false}));
    let built = [];
    const draw = ()=>{
      area.innerHTML = `<div class="slots">${built.map((t,k)=>`<button class="slot" data-k="${k}" aria-label="${esc(t.ch)} を外す">${esc(t.ch)}</button>`).join("")}</div>
        <div class="tiles">${tiles.map(t=>`<button class="tile" data-i="${t.i}" ${t.used?"disabled":""}>${esc(t.ch)}</button>`).join("")}</div>
        <div class="err" id="err"></div><div class="row"><button class="btn sec" id="clr">やり直す</button><button class="btn" id="send">これで答える</button></div>`;
      area.querySelectorAll(".tile").forEach(b=>b.onclick = ()=>{ sfx("tap"); const t = tiles[+b.dataset.i]; t.used = true; built.push(t); draw(); });
      area.querySelectorAll(".slot").forEach(b=>b.onclick = ()=>{ const t = built.splice(+b.dataset.k,1)[0]; t.used = false; draw(); });
      $("#clr").onclick = ()=>{ built.forEach(t=>t.used=false); built = []; draw(); };
      $("#send").onclick = ()=>{
        if(!built.length){ $("#err").textContent = "タイルをタップして答えを作ろう"; return; }
        const v = built.map(t=>t.ch).join("");
        area.querySelectorAll("button").forEach(z=>z.disabled = true);
        storyJudge(acc.includes(v), v, x, ans);
      };
    };
    draw();
  }else{
    area.innerHTML = `<input class="type" id="typed" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="答えを入力"><div class="err" id="err"></div><div id="hintBox"></div><button class="btn" id="send">これで答える</button>`;
    const inp = $("#typed");
    inp.focus({preventScroll:true});
    const submit = ()=>{
      const v = inp.value.trim().toLowerCase().replace(/\s+/g," ");
      if(!v){ $("#err").textContent = "答えを入力してから押してね"; return; }
      if(!/^[a-z' ]+$/.test(v)){ $("#err").textContent = "英語のアルファベットで入力してね"; return; }
      if(acc.includes(v)){ inp.disabled = true; $("#send").disabled = true; storyJudge(true, v, x, ans); return; }
      ST.tries++;

    inp.onkeydown = e=>{ if(e.key==="Enter"){ e.preventDefault(); submit(); } };

/* ---------- パスワード（ハッシュで保存） ---------- */
async function sha(s){
  if(window.crypto && crypto.subtle){
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
  }
  let h1 = 0x811c9dc5, h2 = 0x1b873593;
  for(let i=0;i<s.length;i++){ const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2246822507); }
  return (h1>>>0).toString(16) + (h2>>>0).toString(16);
}
function randCode(){
  const cs = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const a = new Uint32Array(8);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(a); else for(let i=0;i<8;i++) a[i] = Math.floor(Math.random()*1e9);
  const s = Array.from(a).map(x=>cs[x % cs.length]).join("");
  return s.slice(0,4) + "-" + s.slice(4);
}
const normCode = s=>s.toUpperCase().replace(/[^A-Z0-9]/g,"");
async function checkPw(pw){ return !!S.auth && (await sha(S.auth.salt + pw)) === S.auth.pw; }
async function checkSpare(code){ return !!S.auth && (await sha(S.auth.salt + normCode(code))) === S.auth.spare; }
async function setPw(pw){
  const salt = randCode(), spare = randCode();
  S.auth = {salt, pw: await sha(salt + pw), spare: await sha(salt + normCode(spare))};
  save();
  return spare;
}
function pwFields(title, btn){

    <label class="fl">パスワード（4文字以上）<input class="type" id="p1" type="password" autocomplete="new-password"></label>

    <div class="err" id="err"></div><button class="btn" id="setpw">${btn}</button></div>`;
}
function wirePwFields(after){

      if(!t) return null;
      if(t.split("{}").length !== 2) throw `${name}には {} を1つだけ入れてください`;
      const c = val(`#${prefix}c`).split(",").map(s=>s.trim()).filter(Boolean);
      const miss = c.find(x=>!highlight(t.replace("{}","___"), [x]).includes("<mark"));
      if(miss) throw `${name}に手がかりの語「${miss}」が見つかりません`;
      return {t, ja:val(`#${prefix}ja`), c, g:$(`#${prefix}g`).value};
    };
    let pe, ppe;
    try{ pe = ex("pe","過去の例文"); ppe = ex("ppe","過去分詞の例文"); }catch(e){ return err(e); }
    const obj = {b, p, pp, m};
    if(alt.length) obj.ppAlt = alt;
    if(pe) obj.pe = pe;
    if(ppe) obj.ppe = ppe;
    S.custom[b] = obj; save(); rebuild(); sfx("ok"); wordList();
  };
}

/* ---------- バックアップ ---------- */
function backupScreen(){
  $("#app").innerHTML = `
    <div class="bar"><button class="link" id="back">‹ もどる</button><span class="chip">バックアップ</span></div>
    <div class="q"><h2>書き出す</h2>
      <p style="margin:0">進み具合、追加した単語、設定、パスワードをまとめて1つのファイルに保存します。機種変更のときもこのファイルで引き継げます。</p>
      <button class="btn" id="exp">ファイルに書き出す</button><div class="err" id="err1"></div></div>
    <div class="q"><h2>読み込む</h2>
      <p style="margin:0">書き出したファイルを選ぶと、今のデータがそのファイルの内容に置きかわります。パスワードも書き出したときのものに戻ります。</p>
      <input type="file" id="file" accept=".json,application/json" style="margin-top:10px">
      <div class="err" id="err2"></div><div id="conf"></div></div>`;
  $("#back").onclick = parentMenu;
  $("#exp").onclick = async ()=>{
    const d = new Date();
    const name = `verb-monsters-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
    const data = JSON.stringify({app:"verbMonsters", v:1, exported:d.toISOString(), state:S});
    let dl = null;
    try{ if(window.claude && window.claude.use) dl = await window.claude.use("downloads"); }catch(e){ dl = null; }
    if(dl){
      try{ await dl.save({filename:name, data}); $("#err1").textContent = ""; }
      catch(e){ if(e && e.code!=="declined") $("#err1").textContent = "書き出せませんでした。もう一度お試しください"; }
    }else{
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([data], {type:"application/json"}));
      a.download = name; document.body.appendChild(a); a.click(); a.remove();
    }
  };
  $("#file").onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      let o;
      try{ o = JSON.parse(rd.result); }catch(x){ $("#err2").textContent = "このファイルは読み込めません（形式がちがいます）"; return; }
      if(!o || o.app!=="verbMonsters" || !o.state || !o.state.words){ $("#err2").textContent = "このアプリのバックアップファイルではありません"; return; }
      $("#err2").textContent = "";
      $("#conf").innerHTML = `<p style="margin:10px 0 0">${esc((o.exported||"").slice(0,10))} に書き出したデータです。読み込みますか？</p><button class="btn" id="imp">読み込む</button>`;
      $("#imp").onclick = ()=>{
        S = o.state;
        S.settings = Object.assign({music:true, sfx:true, limit:60, extend:30}, S.settings||{});
        S.custom = S.custom || {}; S.off = S.off || {}; S.days = S.days || {};
        S.story = S.story || {}; S.storySeen = S.storySeen || {}; S.unlocked = S.unlocked || 30;
        save(); rebuild(); home();
      };
    };
    rd.readAsText(f);
  };
}

if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
home();
</script>
